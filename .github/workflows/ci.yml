name: "CI - Linting, Vendor Compliance & Unit Tests"

on:
  push:
    branches: [ "main", "18.0", "19.0", "20.0" ]
  pull_request:
    branches: [ "main", "18.0", "19.0", "20.0" ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & XML Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint Python Code with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Clean PEP8 standards.
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Validate XML View Well-Formedness
      run: |
        python -c "
        import os, xml.etree.ElementTree as ET
        failed = False
        for root, _, files in os.walk('.'):
            if '.git' in root:
                continue
            for f in files:
                if f.endswith('.xml'):
                    p = os.path.join(root, f)
                    try:
                        ET.parse(p)
                    except Exception as e:
                        print(f'❌ XML Error in {p}: {e}')
                        failed = True
        if failed:
            exit(1)
        print('✅ All XML views and data templates are well-formed!')
        "

  vendor-compliance:
    name: Odoo Apps Store Vendor Compliance
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Audit Manifests & Guidelines (apps.odoo.com)
      run: |
        python scripts/validate_apps_store.py

  unit-tests:
    name: Unit & Feature Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: vendor-compliance

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Master Unit Test Suite
      run: |
        python tests/run_all_tests.py
